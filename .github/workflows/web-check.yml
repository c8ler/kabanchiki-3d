name: Kabanchiki 3D Auto Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-game:
    runs-on: ubuntu-latest

    steps:
      - name: Get game
        uses: actions/checkout@v4

      - name: Static game checks
        run: node scripts/validate.mjs

      - name: Check JavaScript syntax
        run: |
          sed '/from.*three.*cdn/d' src/game.js > /tmp/game.mjs
          node --check /tmp/game.mjs

      - name: Start local game server
        run: |
          python3 -m http.server 8080 > /tmp/kabanchiki-server.log 2>&1 &
          sleep 2

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Runtime + collision robot on all 5 locations
        run: |
          mkdir -p screenshots logs

          cat > kabanchiki-runtime-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          let failed = false;
          const report = [];

          for(let level=1; level<=5; level++){
            console.log(`\n========== LOCATION ${level} ==========`);

            const page = await browser.newPage({
              viewport:{width:1280,height:720}
            });

            const errors = [];

            page.on('pageerror', e =>
              errors.push(`PAGE ERROR: ${e.message}`)
            );

            page.on('console', m => {
              if(m.type()==='error')
                errors.push(`CONSOLE ERROR: ${m.text()}`);
            });

            let state = null;

            try {
              await page.goto(
                `http://127.0.0.1:8080/?autotest=1&level=${level}`,
                {
                  waitUntil:'domcontentloaded',
                  timeout:30000
                }
              );

              await page.waitForFunction(
                () => window.__KABANCHIKI_TEST__?.ready === true,
                null,
                {timeout:30000}
              );

              await page.waitForTimeout(2500);

              state = await page.evaluate(() =>
                structuredClone(window.__KABANCHIKI_TEST__)
              );

              const c = state.collisionAudit || {
                ok:false,
                issues:['missing-collision-audit']
              };

              const r = state.robotAudit || {
                ok:false,
                issues:['missing-robot-audit'],
                samples:[]
              };

              console.log(
                `VERSION: ${state.version} | READY: ${state.ready}`
              );

              console.log(
                `COLLISION AUDIT: ${c.ok?'PASS':'FAIL'} | ` +
                `obstacles=${c.obstacles??'?'} ` +
                `rocks=${c.preciseRockFootprints??'?'} ` +
                `treeSolids=${c.treeSolids??'?'}`
              );

              for(const x of c.issues || [])
                console.log(`  COLLISION FAIL: ${x}`);

              console.log(
                `ROBOT AUDIT: ${r.ok?'PASS':'FAIL'} | ` +
                `trees=${r.treesTested??'?'} ` +
                `rocks=${r.rocksTested??'?'}`
              );

              for(const x of r.issues || [])
                console.log(`  ROBOT FAIL: ${x}`);

              const groups = {
                tree:[],
                rockInto:[],
                rockAway:[],
                rockJump:[]
              };

              for(const s of r.samples || []){
                if(s.label.startsWith('tree'))
                  groups.tree.push(s);
                else if(s.label.includes('-into'))
                  groups.rockInto.push(s);
                else if(s.label.includes('-away'))
                  groups.rockAway.push(s);
                else if(s.label.includes('-jump'))
                  groups.rockJump.push(s);
              }

              const line = (name,a) =>
                console.log(
                  `${name}: ${a.length} probes | ` +
                  `blocked=${a.filter(x=>x.blocked).length} | ` +
                  `free=${a.filter(x=>!x.blocked).length}`
                );

              line('TREE ESCAPE', groups.tree);
              line('ROCK WALK-IN', groups.rockInto);
              line('ROCK ESCAPE', groups.rockAway);
              line('ROCK JUMP', groups.rockJump);

              if(state.ready !== true)
                errors.push('ready=false');

              if(Number(state.level) !== level)
                errors.push(`wrong-level:${state.level}`);

              if(!c.ok)
                for(const x of c.issues || [])
                  errors.push(`COLLISION:${x}`);

              if(!r.ok)
                for(const x of r.issues || [])
                  errors.push(`ROBOT:${x}`);

              for(const x of state.errors || [])
                if(!errors.some(e => e.endsWith(x)))
                  errors.push(`GAME:${x}`);

              await page.screenshot({
                path:`screenshots/runtime-location-${level}.png`
              });

            } catch(e) {
              errors.push(`TEST:${e.message}`);
            }

            const ok = errors.length === 0;

            if(!ok)
              failed = true;

            console.log(`${ok?'PASS':'FAIL'} LOCATION ${level}`);

            for(const e of errors)
              console.log(`  ${e}`);

            report.push({
              level,
              ok,
              errors,
              state
            });

            fs.writeFileSync(
              `logs/location-${level}.json`,
              JSON.stringify(report.at(-1),null,2)
            );

            await page.close();
          }

          fs.writeFileSync(
            'logs/summary.json',
            JSON.stringify(report,null,2)
          );

          await browser.close();

          console.log(
            `\n========== FINAL: ${failed?'FAIL':'PASS'} ==========`
          );

          if(failed)
            process.exit(1);
          EOF

          node kabanchiki-runtime-test.mjs

      - name: Save screenshots and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabanchiki-v81-test-report
          path: |
            screenshots/
            logs/
