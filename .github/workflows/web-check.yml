name: Kabanchiki 3D Auto Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-game:
    runs-on: ubuntu-latest

    steps:
      - name: Get game
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f src/game.js
          test -f levels/levels.js
          echo "Required files OK"

      - name: Check JavaScript syntax
        run: |
          cp src/game.js /tmp/game.mjs
          sed -i '/from.*three.*cdn/d' /tmp/game.mjs || true
          node --check /tmp/game.mjs

      - name: Start local game server
        run: |
          python3 -m http.server 8080 > /tmp/kabanchiki-server.log 2>&1 &
          sleep 2

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Test all 5 locations
        run: |
          mkdir -p screenshots logs
          CHROME=$(command -v chromium-browser || command -v chromium)

          FAILED=0

          for LEVEL in 1 2 3 4 5
          do
            echo ""
            echo "===================================="
            echo "Testing Kabanchiki location $LEVEL"
            echo "===================================="

            SUCCESS=0

            for ATTEMPT in 1 2
            do
              echo "Location $LEVEL - attempt $ATTEMPT/2"

              rm -f "screenshots/location-$LEVEL.png"

              "$CHROME" \
                --headless \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-gpu \
                --disable-background-networking \
                --disable-component-update \
                --disable-sync \
                --no-first-run \
                --window-size=1280,720 \
                --virtual-time-budget=10000 \
                --run-all-compositor-stages-before-draw \
                --screenshot="screenshots/location-$LEVEL.png" \
                "http://127.0.0.1:8080/?autotest=1&level=$LEVEL" \
                >"logs/location-$LEVEL-attempt-$ATTEMPT.log" 2>&1 &

              PID=$!

              for i in {1..30}
              do
                if [ -s "screenshots/location-$LEVEL.png" ]; then
                  SUCCESS=1
                  break
                fi

                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true

              if [ "$SUCCESS" -eq 1 ]; then
                echo "PASS: Location $LEVEL rendered on attempt $ATTEMPT"
                break
              fi

              echo "Attempt $ATTEMPT failed for location $LEVEL"
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "FAIL: Location $LEVEL failed twice"
              echo "----- Last browser log -----"
              cat "logs/location-$LEVEL-attempt-2.log" || true
              echo "----------------------------"
              FAILED=1
            fi
          done

          echo ""
          echo "========== FINAL RESULT =========="

          if [ "$FAILED" -ne 0 ]; then
            echo "AUTOTEST FAILED"
            exit 1
          fi

          echo "ALL 5 LOCATIONS PASSED"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Check JavaScript runtime
        run: |
          cat > /tmp/kabanchiki-runtime-test.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true
          });

          let failed = false;

          for (let level = 1; level <= 5; level++) {
            console.log(`\n=== JS TEST LOCATION ${level} ===`);

            const page = await browser.newPage({
              viewport: { width: 1280, height: 720 }
            });

            const errors = [];

            page.on('pageerror', error => {
              errors.push(`PAGE ERROR: ${error.message}`);
            });

            page.on('console', msg => {
              if (msg.type() === 'error') {
                errors.push(`CONSOLE ERROR: ${msg.text()}`);
              }
            });

            try {
              await page.goto(
                `http://127.0.0.1:8080/?autotest=1&level=${level}`,
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                }
              );

              await page.waitForFunction(
                () => window.__KABANCHIKI_TEST__?.ready === true,
                null,
                { timeout: 30000 }
              );

              // Даём игровому циклу поработать несколько секунд.
              await page.waitForTimeout(5000);

              const state = await page.evaluate(() => ({
                ready: window.__KABANCHIKI_TEST__?.ready,
                level: window.__KABANCHIKI_TEST__?.level,
                errors: window.__KABANCHIKI_TEST__?.errors || []
              }));

              console.log('Test state:', JSON.stringify(state));

              if (state.ready !== true) {
                errors.push('Game did not report ready=true');
              }

              if (Number(state.level) !== level) {
                errors.push(
                  `Wrong level: expected ${level}, got ${state.level}`
                );
              }

              if (state.errors.length) {
                for (const error of state.errors) {
                  errors.push(`GAME ERROR: ${error}`);
                }
              }

              await page.screenshot({
                path: `screenshots/runtime-location-${level}.png`,
                fullPage: false
              });

            } catch (error) {
              errors.push(`TEST ERROR: ${error.message}`);
            }

            if (errors.length) {
              failed = true;
              console.log(`FAIL: Location ${level}`);

              for (const error of errors) {
                console.log(error);
              }
            } else {
              console.log(`PASS: Location ${level} - no JS errors`);
            }

            await page.close();
          }

          await browser.close();

          if (failed) {
            console.error('\nKABANCHIKI RUNTIME TEST FAILED');
            process.exit(1);
          }

          console.log('\nALL 5 LOCATIONS PASSED RUNTIME TEST');
          EOF

          node /tmp/kabanchiki-runtime-test.mjs


      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabanchiki-test-screenshots
          path: screenshots/
