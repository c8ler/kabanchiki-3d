name: Kabanchiki 3D Auto Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-game:
    runs-on: ubuntu-latest

    steps:
      - name: Get game
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f src/game.js
          test -f levels/levels.js
          echo "Required files OK"

      - name: Check JavaScript syntax
        run: |
          cp src/game.js /tmp/game.mjs
          sed -i '/from.*three.*cdn/d' /tmp/game.mjs || true
          node --check /tmp/game.mjs

      - name: Start local game server
        run: |
          python3 -m http.server 8080 > /tmp/kabanchiki-server.log 2>&1 &
          sleep 2

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Test all 5 locations
        run: |
          mkdir -p screenshots logs
          CHROME=$(command -v chromium-browser || command -v chromium)

          FAILED=0

          for LEVEL in 1 2 3 4 5
          do
            echo ""
            echo "===================================="
            echo "Testing Kabanchiki location $LEVEL"
            echo "===================================="

            SUCCESS=0

            for ATTEMPT in 1 2
            do
              echo "Location $LEVEL - attempt $ATTEMPT/2"

              rm -f "screenshots/location-$LEVEL.png"

              "$CHROME" \
                --headless \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-gpu \
                --disable-background-networking \
                --disable-component-update \
                --disable-sync \
                --no-first-run \
                --window-size=1280,720 \
                --virtual-time-budget=10000 \
                --run-all-compositor-stages-before-draw \
                --screenshot="screenshots/location-$LEVEL.png" \
                "http://127.0.0.1:8080/?autotest=1&level=$LEVEL" \
                >"logs/location-$LEVEL-attempt-$ATTEMPT.log" 2>&1 &

              PID=$!

              for i in {1..30}
              do
                if [ -s "screenshots/location-$LEVEL.png" ]; then
                  SUCCESS=1
                  break
                fi

                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true

              if [ "$SUCCESS" -eq 1 ]; then
                echo "PASS: Location $LEVEL rendered on attempt $ATTEMPT"
                break
              fi

              echo "Attempt $ATTEMPT failed for location $LEVEL"
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "FAIL: Location $LEVEL failed twice"
              echo "----- Last browser log -----"
              cat "logs/location-$LEVEL-attempt-2.log" || true
              echo "----------------------------"
              FAILED=1
            fi
          done

          echo ""
          echo "========== FINAL RESULT =========="

          if [ "$FAILED" -ne 0 ]; then
            echo "AUTOTEST FAILED"
            exit 1
          fi

          echo "ALL 5 LOCATIONS PASSED"



      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabanchiki-test-screenshots
          path: screenshots/
