name: Kabanchiki 3D Auto Test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-v175.py
      - name: Syntax check
        run: node --check src/game.js
      - name: Commit game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js index.html scripts/validate.mjs
          git commit -m "v175: improve menu keyboard flow and grass visuals"
          git push
