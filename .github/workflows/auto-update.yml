name: Kabanchiki Auto Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[KABANCHIKI-UPDATE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode update package
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" \
            | sed -n '/KABANCHIKI_BASE64_BEGIN/,/KABANCHIKI_BASE64_END/p' \
            | sed '1d;$d' \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/kabanchiki.zip

          unzip -t /tmp/kabanchiki.zip

          rm -rf /tmp/kabanchiki
          mkdir -p /tmp/kabanchiki
          unzip -q /tmp/kabanchiki.zip -d /tmp/kabanchiki

          GAME_INDEX=$(find /tmp/kabanchiki -name index.html -type f | head -1)

          if [ -z "$GAME_INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          GAME_ROOT=$(dirname "$GAME_INDEX")
          echo "GAME_ROOT=$GAME_ROOT" >> "$GITHUB_ENV"

      - name: Install update
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$GAME_ROOT"/. .

      - name: Verify game
        run: |
          test -f index.html
          test -f src/game.js

          sed '/^import .*three.*;/d' src/game.js > /tmp/game.mjs
          node --check /tmp/game.mjs

          if [ -f scripts/validate.mjs ]; then
            node scripts/validate.mjs
          fi

      - name: Commit and publish
        run: |
          git config user.name "Kabanchiki Update Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No game changes detected"
          else
            VERSION="${{ github.event.issue.title }}"
            VERSION="${VERSION#'[KABANCHIKI-UPDATE] '}"
            git commit -m "Publish ${VERSION}"
            git push
          fi

      - name: Close update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "✅ Kabanchiki update processed by GitHub Actions."
