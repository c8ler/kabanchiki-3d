name: Kabanchiki Auto Update

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find update ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Kabanchiki_3D_*.zip' | sort | tail -1)
          test -n "$ZIP" || { echo "ERROR: update ZIP not found"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unpack update
        run: |
          rm -rf /tmp/kabanchiki /tmp/newgame
          mkdir -p /tmp/kabanchiki /tmp/newgame
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d /tmp/kabanchiki
          GAME_INDEX=$(find /tmp/kabanchiki -name index.html -type f | head -1)
          test -n "$GAME_INDEX" || { echo "ERROR: index.html not found"; exit 1; }
          echo "GAME_ROOT=$(dirname "$GAME_INDEX")" >> "$GITHUB_ENV"

      - name: Install update
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'Kabanchiki_3D_*.zip' -exec rm -rf {} +
          cp -a "$GAME_ROOT"/. /tmp/newgame/
          rm -rf /tmp/newgame/.github
          rm -f /tmp/newgame/Kabanchiki_3D_*.zip /tmp/newgame/auto-update-v81.yml
          cp -a /tmp/newgame/. .

      - name: Verify game
        run: |
          test -f index.html && test -f src/game.js
          sed '/^import .*three.*;/d' src/game.js > /tmp/game.mjs
          node --check /tmp/game.mjs
          node scripts/validate.mjs

      - name: Remove update ZIP and commit
        run: |
          rm -f ./Kabanchiki_3D_*.zip
          git config user.name "Kabanchiki Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            VERSION=$(grep -o "GAME_VERSION='v[0-9]*'" src/game.js | head -1 | cut -d"'" -f2)
            git commit -m "Publish Kabanchiki 3D ${VERSION}"
            git push
          fi

      - name: Run autotest on published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-check.yml --ref main
