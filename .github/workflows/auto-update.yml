name: Kabanchiki Auto Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v71"
        required: true
        default: "v71"
      zip_url:
        description: "Direct URL to Kabanchiki ZIP"
        required: true

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download new version
        run: |
          curl -L --fail "${{ inputs.zip_url }}" -o /tmp/kabanchiki.zip
          mkdir -p /tmp/kabanchiki
          unzip -q /tmp/kabanchiki.zip -d /tmp/kabanchiki

      - name: Find game root
        run: |
          GAME_INDEX=$(find /tmp/kabanchiki -name index.html -type f | head -1)

          if [ -z "$GAME_INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          GAME_ROOT=$(dirname "$GAME_INDEX")
          echo "GAME_ROOT=$GAME_ROOT" >> "$GITHUB_ENV"

      - name: Install new game
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$GAME_ROOT"/. .

      - name: Verify game
        run: |
          test -f index.html
          test -f src/game.js

          cp src/game.js /tmp/game.mjs
          sed -i '/from.*three.*;/d' /tmp/game.mjs
          node --check /tmp/game.mjs

          echo "Game files verified"

      - name: Commit new version
        run: |
          git config user.name "Kabanchiki Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.version }}"
          git push
