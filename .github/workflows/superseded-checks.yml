name: Cancel superseded checks
on:
  push:
    branches: [refactor/v215-game-modules]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
concurrency:
  group: superseded-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const fullName = context.repo.owner + '/' + context.repo.repo;
            if (pr && pr.head.repo.full_name !== fullName) return;
            const branch = pr ? pr.head.ref : context.ref.replace('refs/heads/', '');
            const {data: current} = await github.rest.repos.getBranch({...context.repo, branch});
            const latest = current.commit.sha;
            for (const status of ['queued', 'in_progress', 'pending', 'waiting']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                {...context.repo, status, per_page: 100});
              for (const run of runs) {
                if (run.id === context.runId || run.event !== 'pull_request' ||
                    run.head_branch !== branch || run.head_sha === latest) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  core.info('Cancelled superseded run ' + run.id);
                } catch (error) {
                  if (error.status !== 409 && error.status !== 404) throw error;
                }
              }
            }
