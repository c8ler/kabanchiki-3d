name: Gameplay changes checks
on:
  pull_request:
  push:
    branches: [fix/v203-home-water-navigation]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check src/game.js
      - run: npm test
      - run: node --test tests/boar-exit-regressions.mjs
      - run: node scripts/validate.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          python3 -m http.server 8080 > /tmp/kabanchiki-server.log 2>&1 &
          node scripts/v202-browser.mjs
          node scripts/v203-browser.mjs
