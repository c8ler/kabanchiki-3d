name: Gameplay changes checks
on:
  pull_request:
  push:
    branches: [fix/v207-home-reset]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check src/game.js
      - run: npm test
      - run: node --test tests/boar-exit-regressions.mjs
      - run: node scripts/validate.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          python3 -m http.server 8080 > /tmp/kabanchiki-server.log 2>&1 &
          node scripts/v207-browser.mjs
          node scripts/v206-browser.mjs
          node scripts/v205-browser.mjs
          node scripts/v202-browser.mjs
          node scripts/v203-browser.mjs
          node scripts/v204-browser.mjs
      - name: First person screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v207-first-person-previews
          path: screenshots/v207-*.png
