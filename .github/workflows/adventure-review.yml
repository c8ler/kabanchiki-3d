name: Adventure review
on:
  push:
    branches: [fix/v211-adventure]
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm run validate
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser and visual review
        run: |
          python3 -m http.server 8080 > /tmp/game-server.log 2>&1 &
          node scripts/v211-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adventure-previews
          path: screenshots/v211-*
