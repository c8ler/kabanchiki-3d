name: Adventure review
on:
  push:
    branches: [fix/v211-adventure]
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm run validate
      - run: npm install --no-save playwright@1.56.1
      - name: Browser and visual review
        run: |
          node scripts/serve.mjs 8080 > /tmp/game-server.log 2>&1 &
          node scripts/leaderboard-check.mjs
          node scripts/v221-browser.mjs
          node scripts/v220-browser.mjs
          node scripts/v219-browser.mjs
          node scripts/v211-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adventure-previews
          path: screenshots/v2*
