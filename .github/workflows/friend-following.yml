name: Friend following checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  following:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          node scripts/serve.mjs 8080 > /tmp/friend-server.log 2>&1 &
          node scripts/friend-following-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friend-following
          path: screenshots/friend-*
