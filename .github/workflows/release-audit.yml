name: Release audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mixed-session:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Mixed actions, profiling, transitions and continuous play
        env:
          BROWSER: ${{ matrix.browser }}
          RELEASE_SEED: '1901'
        run: |
          node scripts/serve.mjs 8080 > /tmp/release-server.log 2>&1 &
          mkdir -p logs screenshots
          chown pwuser:pwuser logs screenshots
          runuser -u pwuser -- node scripts/release-audit-browser.mjs
      - name: Independent route seed
        if: always() && matrix.browser != 'firefox'
        env:
          BROWSER: ${{ matrix.browser }}
          ROBOT_SEED: '1901'
        run: node scripts/boar-robot-browser.mjs
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/release-server.log logs/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audit-${{ matrix.browser }}
          path: |
            logs/
            screenshots/
