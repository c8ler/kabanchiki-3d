name: Controls menus and minions
on:
  pull_request:
    branches: [main]
concurrency:
  group: v213-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8080 > /tmp/http213.log 2>&1 &
          node scripts/v213-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v213-screenshots
          path: screenshots/
